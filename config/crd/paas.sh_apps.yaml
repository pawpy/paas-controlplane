---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: apps.paas.sh
spec:
  group: paas.sh
  names:
    kind: App
    listKind: AppList
    plural: apps
    singular: app
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.image
      name: Image
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          App is a tenant application: a stable name + config, deployed to whatever
          image the newest Release for it points at.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AppSpec is the desired state of a tenant application. It carries the
              long-lived config; the image to run comes from the newest Release.
            properties:
              domains:
                description: Domains are extra hostnames to route (the sslip.io host
                  is always added).
                items:
                  type: string
                type: array
              env:
                description: Env is injected into the container (PORT is always set
                  by the operator).
                items:
                  description: EnvVar is a plain name/value environment variable for
                    the app process.
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              owner:
                description: Owner is the user that owns the app (multi-user comes
                  later).
                type: string
              port:
                default: 8080
                description: Port the app process listens on inside the container.
                format: int32
                type: integer
              replicas:
                default: 1
                format: int32
                type: integer
              resources:
                description: Resources is the per-replica CPU/memory ceiling.
                properties:
                  cpu:
                    default: 500m
                    type: string
                  memory:
                    default: 512Mi
                    type: string
                type: object
            type: object
          status:
            description: AppStatus is the observed state.
            properties:
              image:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              readyReplicas:
                format: int32
                type: integer
              url:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
